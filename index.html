<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EchoBegecko's Website</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">EchoBegecko's Website</div>
        <button id="chatButton" class="chat-button">Chat</button>
    </header>

    <main class="workspace" id="workspaceContainer">
        <div class="workspace-label">WORKSPACE</div>

        <div class="tilt-wrapper" id="tiltCard">
            <section class="profile-card">
                <img
                    class="avatar"
                    src="https://minotar.net/helm/EchoBegecko/128.png"
                    alt="EchoBegecko's Minecraft avatar"
                >
                <h1>EchoBegecko</h1>
                <p class="subtitle">Welcome to my website!</p>
                <div class="status">
                    <span class="status-dot"></span>
                    Website online
                </div>
            </section>
        </div>
    </main>

    <div id="chatOverlay" class="overlay hidden">
        <section class="chat-window" role="dialog" aria-modal="true">
            <div class="chat-header">
                <div>
                    <h2>Community Chat</h2>
                    <p>Messages disappear after 30 minutes.</p>
                </div>
                <button id="closeChat" class="icon-button" aria-label="Close chat">×</button>
            </div>

            <section id="loginPanel">
                <h3>Sign in to chat</h3>
                <form id="loginForm">
                    <label for="username">Username</label>
                    <input id="username" name="username" autocomplete="username"
                           maxlength="40" required>

                    <label for="password">Password</label>
                    <input id="password" name="password" type="password"
                           autocomplete="current-password" required>

                    <p id="loginError" class="error" aria-live="polite"></p>
                    <button class="primary-button" type="submit">Log in</button>
                </form>
                <p class="small-note">Only approved accounts can join.</p>
            </section>

            <section id="chatPanel" class="hidden">
                <div class="chat-userbar">
                    <span>Signed in as <strong id="currentUser"></strong></span>
                    <button id="logoutButton" class="text-button">Log out</button>
                </div>

                <div id="messages" class="messages" aria-live="polite"></div>

                <form id="messageForm" class="message-form">
                    <input id="messageInput" maxlength="500"
                           placeholder="Write a message..." autocomplete="off"
                           required>
                    <button class="primary-button" type="submit">Send</button>
                </form>
                <p id="chatError" class="error" aria-live="polite"></p>
            </section>
        </section>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/script.js"></script>
</body>
</html>
