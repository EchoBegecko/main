<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EchoBegecko's Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Full Blockbench Workspace Container -->
    <div class="blockbench-container">
        <header class="bb-header">
            <div class="bb-title">EchoBegecko's Website</div>
        </header>

        <main class="bb-workspace" id="workspaceContainer">
            <!-- 3D Tilt Wrapper: Set 7cm down from the top, stretched with 1cm side margins -->
            <div class="tilt-wrapper" id="tiltCard">
                <!-- Inside layer isolates the idle up/down bop safely away from tilt math -->
                <div class="bop-layer">
                    <div class="profile-card">
                        <!-- Corrected and highly reliable MC-Heads render engine link -->
                        <img class="avatar" src="https://mc-heads.net" alt="Minecraft Head">
                        <div class="card-info">
                            <span class="username">EchoBegecko</span>
                            <span class="status-tag">Online</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Links the tracking logic script -->
    <script src="script.js"></script>
</body>
</html>
