<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EchoBegecko's Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Full Blockbench Workspace Container -->
    <div class="blockbench-container">
        <header class="bb-header">
            <!-- Centered Header Title -->
            <div class="bb-title">EchoBegecko's Website</div>
        </header>

        <main class="bb-workspace">
            <!-- 3D Tilt Wrapper: Stretches screen-wide with 1cm margins and sits 5cm down -->
            <div class="tilt-wrapper" id="tiltCard">
                <!-- Inner profile contents -->
                <div class="profile-card">
                    <!-- Fetches 3D skin head via your UUID -->
                    <img class="avatar" src="https://crafatar.com" alt="Minecraft Head">
                    <div class="card-info">
                        <span class="username">EchoBegecko</span>
                        <span class="status-tag">Online</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Links the 3x tracking logic script -->
    <script src="script.js"></script>
</body>
</html>
